<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Train Ticketing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2a2d3a;
            --accent: #6c8eff;
            --accent2: #a78bfa;
            --text: #e8eaf0;
            --muted: #8890a4;
            --success: #4ade80;
            --error: #f87171;
            --radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        header { text-align: center; margin-bottom: 2.5rem; }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p { color: var(--muted); margin-top: 0.4rem; font-size: 0.9rem; letter-spacing: 0.05em; }

        .tabs { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 2rem; }

        .tab-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 0.6rem 1.6rem;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .container { max-width: 700px; margin: 0 auto; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.8rem;
            margin-bottom: 1.2rem;
        }

        .card h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        .form-row.single { grid-template-columns: 1fr; }
        .form-row.triple { grid-template-columns: 1fr 1fr 1fr; }

        label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.4rem; font-weight: 500; letter-spacing: 0.04em; }

        select, input, textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 0.6rem 0.9rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: border-color 0.2s;
            outline: none;
        }

        select:focus, input:focus, textarea:focus { border-color: var(--accent); }
        textarea { resize: vertical; min-height: 90px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 1.4rem;
            border-radius: 8px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:active { transform: scale(0.97); }
        .btn:hover { opacity: 0.88; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-danger { background: var(--error); color: #fff; }
        .btn-warning { background: #f59e0b; color: #fff; }
        .btn-full { width: 100%; margin-top: 0.5rem; }

        .result { margin-top: 1rem; padding: 1rem; border-radius: 8px; font-size: 0.88rem; line-height: 1.6; display: none; }
        .result.success { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); color: var(--success); display: block; }
        .result.error   { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--error);   display: block; }
        .result.info    { background: rgba(108,142,255,0.1); border: 1px solid rgba(108,142,255,0.3); color: var(--accent);  display: block; }

        .leg { padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
        .leg:last-child { border-bottom: none; }
        .leg-train { font-weight: 600; color: var(--accent2); }
        .leg-time { color: var(--muted); font-size: 0.82rem; }

        .admin-lock { display: flex; gap: 0.8rem; align-items: flex-end; margin-bottom: 1.2rem; }
        #adminPanel { display: none; }
        #adminPanel.unlocked { display: block; }
        .booking-list { font-size: 0.85rem; line-height: 2; color: var(--muted); }
    </style>
</head>
<body>
<header>
    <h1>Train Ticketing</h1>
    <p>Siemens Problem 1 — Spring Boot + Supabase</p>
</header>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('customer', this)">Customer</button>
    <button class="tab-btn" onclick="switchTab('admin', this)">Admin</button>
</div>

<!-- CUSTOMER TAB -->
<div id="tab-customer" class="tab-content active">
    <div class="container">
        <div class="card">
            <h2>Find Path</h2>
            <div class="form-row">
                <div><label>From</label><select id="fromStation"><option value="">Loading...</option></select></div>
                <div><label>To</label><select id="toStation"><option value="">Loading...</option></select></div>
            </div>
            <button class="btn btn-primary btn-full" onclick="findPath()">Find Path</button>
            <div id="pathResult" class="result"></div>
        </div>

        <div class="card">
            <h2>Book a Ticket</h2>
            <div class="form-row">
                <div><label>Train ID</label><input id="bookTrainId" placeholder="e.g. ICE100"/></div>
                <div><label>Travel Date</label><input id="bookDate" type="date"/></div>
            </div>
            <div class="form-row">
                <div><label>Email</label><input id="bookEmail" type="email" placeholder="your@email.com"/></div>
                <div><label>Seats</label><input id="bookSeats" type="number" min="1" max="10" value="1"/></div>
            </div>
            <button class="btn btn-primary btn-full" onclick="bookTicket()">Book</button>
            <div id="bookResult" class="result"></div>
        </div>
    </div>
</div>

<!-- ADMIN TAB -->
<div id="tab-admin" class="tab-content">
    <div class="container">
        <div class="card">
            <h2>Admin Login</h2>
            <div class="admin-lock">
                <div style="flex:1"><label>Username</label><input id="adminUser" value="admin"/></div>
                <div style="flex:1"><label>Password</label><input id="adminPass" type="password" value="admin"/></div>
                <button class="btn btn-primary" onclick="adminLogin()">Unlock</button>
            </div>
            <div id="loginResult" class="result"></div>
        </div>

        <div id="adminPanel">
            <div class="card">
                <h2>Add Train</h2>
                <div class="form-row triple">
                    <div><label>ID</label><input id="trainId" placeholder="ICE300"/></div>
                    <div><label>Name</label><input id="trainName" placeholder="Express"/></div>
                    <div><label>Capacity</label><input id="trainCap" type="number" value="200"/></div>
                </div>
                <div class="form-row single">
                    <div>
                        <label>Stops (one per line: StationName,HH:MM,HH:MM)</label>
                        <textarea id="trainStops">Berlin,08:00,08:05
Leipzig,09:20,09:22
Munich,12:10,12:10</textarea>
                    </div>
                </div>
                <button class="btn btn-primary btn-full" onclick="saveTrain()">Save Train</button>
                <div id="saveResult" class="result"></div>
            </div>

            <div class="card">
                <h2>Delete Train</h2>
                <div class="form-row">
                    <div><label>Train ID</label><input id="deleteId" placeholder="ICE300"/></div>
                </div>
                <button class="btn btn-danger" onclick="deleteTrain()">Delete</button>
                <div id="deleteResult" class="result"></div>
            </div>

            <div class="card">
                <h2>Notify Delay</h2>
                <div class="form-row">
                    <div><label>Train ID</label><input id="delayTrainId" placeholder="ICE100"/></div>
                    <div><label>Delay</label><input id="delayText" value="+25 min"/></div>
                </div>
                <button class="btn btn-warning" onclick="notifyDelay()">Send Notifications</button>
                <div id="delayResult" class="result"></div>
            </div>

            <div class="card">
                <h2>All Bookings</h2>
                <button class="btn btn-primary" onclick="loadBookings()">Refresh</button>
                <div id="bookingsList" class="booking-list" style="margin-top:1rem;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let adminCredentials = null;

    function switchTab(name, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        btn.classList.add('active');
    }

    async function loadStations() {
        const res = await fetch('/api/stations');
        const stations = await res.json();
        ['fromStation', 'toStation'].forEach(id => {
            const sel = document.getElementById(id);
            sel.innerHTML = '<option value="">Select station</option>';
            stations.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s; opt.textContent = s;
                sel.appendChild(opt);
            });
        });
    }

    async function findPath() {
    const from = document.getElementById('fromStation').value;
    const to = document.getElementById('toStation').value;
    const el = document.getElementById('pathResult');
    if (!from || !to) { showResult(el, 'Please select both origin and destination.', 'error'); return; }
    if (from === to)  { showResult(el, 'Origin and destination must be different.', 'error'); return; }

    const res = await fetch(`/api/path?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
    const data = await res.json();
    if (!res.ok) { showResult(el, data.error, 'error'); return; }

    el.innerHTML = data.map(leg =>
        `<div class="leg" onclick="selectTrain('${leg.trainId}')" style="cursor:pointer;" title="Click to select this train">
            <span class="leg-train">${leg.trainId}</span> · ${leg.fromStation} → ${leg.toStation}<br/>
            <span class="leg-time">${leg.depart} → ${leg.arrive}</span>
        </div>`
    ).join('');
    el.className = 'result info';
}

function selectTrain(trainId) {
    document.getElementById('bookTrainId').value = trainId;
    document.querySelectorAll('.leg').forEach(l => l.style.background = '');
    event.currentTarget.style.background = 'rgba(108,142,255,0.15)';
}

    async function bookTicket() {
        const el = document.getElementById('bookResult');
        const body = {
            trainId: document.getElementById('bookTrainId').value,
            date: document.getElementById('bookDate').value,
            email: document.getElementById('bookEmail').value,
            seats: parseInt(document.getElementById('bookSeats').value)
        };
        const res = await fetch('/api/bookings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) showResult(el, data.error, 'error');
        else showResult(el, `✓ Booking confirmed! ID: ${data.bookingId} — confirmation sent to ${data.email}`, 'success');
    }

    async function adminLogin() {
        const user = document.getElementById('adminUser').value;
        const pass = document.getElementById('adminPass').value;
        const el = document.getElementById('loginResult');
        const creds = btoa(user + ':' + pass);
        const res = await fetch('/api/bookings', { headers: { 'Authorization': 'Basic ' + creds } });
        if (res.ok) {
            adminCredentials = creds;
            document.getElementById('adminPanel').classList.add('unlocked');
            showResult(el, '✓ Logged in as admin.', 'success');
        } else {
            showResult(el, 'Invalid credentials.', 'error');
        }
    }

    function authHeaders() {
        return { 'Authorization': 'Basic ' + adminCredentials, 'Content-Type': 'application/json' };
    }

    async function saveTrain() {
        const el = document.getElementById('saveResult');
        const stops = document.getElementById('trainStops').value.trim().split('\n').map(line => {
            const [stationName, arrival, departure] = line.split(',').map(s => s.trim());
            return { stationName, arrival, departure };
        });
        const body = {
            id: document.getElementById('trainId').value,
            name: document.getElementById('trainName').value,
            capacity: parseInt(document.getElementById('trainCap').value),
            stops
        };
        const res = await fetch('/api/trains', { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok) showResult(el, data.error, 'error');
        else { showResult(el, '✓ ' + data.message, 'success'); loadStations(); }
    }

    async function deleteTrain() {
        const id = document.getElementById('deleteId').value;
        const el = document.getElementById('deleteResult');
        const res = await fetch(`/api/trains/${id}`, { method: 'DELETE', headers: authHeaders() });
        const data = await res.json();
        if (!res.ok) showResult(el, data.error, 'error');
        else { showResult(el, '✓ ' + data.message, 'success'); loadStations(); }
    }

    async function notifyDelay() {
        const id = document.getElementById('delayTrainId').value;
        const delayText = document.getElementById('delayText').value;
        const el = document.getElementById('delayResult');
        const res = await fetch(`/api/trains/${id}/delay`, {
            method: 'POST', headers: authHeaders(), body: JSON.stringify({ delayText })
        });
        const data = await res.json();
        if (!res.ok) showResult(el, data.error, 'error');
        else showResult(el, '✓ ' + data.message, 'success');
    }

    async function loadBookings() {
        const res = await fetch('/api/bookings', { headers: { 'Authorization': 'Basic ' + adminCredentials } });
        const data = await res.json();
        const el = document.getElementById('bookingsList');
        if (!data.length) { el.innerHTML = '<span>No bookings yet.</span>'; return; }
        el.innerHTML = data.map(b =>
            `<div>${b.bookingId} · Train ${b.trainId} · ${b.travelDate} · ${b.seats} seat(s) · ${b.email}</div>`
        ).join('');
    }

    function showResult(el, msg, type) {
        el.textContent = msg;
        el.className = 'result ' + type;
    }

    document.getElementById('bookDate').valueAsDate = new Date(Date.now() + 86400000);
    loadStations();
</script>
</body>
</html>
